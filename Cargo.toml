[package]
name = "h2d"
version = "0.1.0"
edition = "2024"
description = "LAN CLI for a Bambu Lab H2D: slice with OrcaSlicer, upload, and start prints"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
native-tls = "0.2"
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
